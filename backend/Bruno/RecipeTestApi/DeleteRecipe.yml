info:
  name: DELETE Recipe
  type: http
  seq: 5

http:
  method: DELETE
  url: "{{host}}/api/Recipes/{{recipeId}}"
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        if (!Number.isInteger(bru.getVar("recipeId")) || bru.getVar("recipeId") <= 0) {
          throw new Error("Run POST Create recipe first.");
        }
    - type: tests
      code: |-
        test("Delete a recipe", function () {
          expect(res.status).to.equal(204);
        });

settings:
  encodeUrl: true
  timeout: 10000
  followRedirects: false
